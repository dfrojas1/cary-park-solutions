<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nerve Distribution — Triangle Hand & Shoulder Center</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#02080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:ui-sans-serif,system-ui,sans-serif;padding:20px}
  .wrap{width:100%;max-width:720px}
  h1{text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(0,212,255,.38);margin-bottom:14px}

  /* ── Base nerve styles ── */
  .nerve{fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* Draw-on animation */
  @keyframes drawNerve{
    from{stroke-dashoffset:1000;opacity:0}
    to{stroke-dashoffset:0;opacity:1}
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:.95}}

  /* Skeleton */
  .skel{animation:fadeIn .9s ease .2s both}

  /* Nerve trunks */
  .med-trunk {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.5s ease 2s both}
  .uln-trunk {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.4s ease 2.5s both}
  .rad-sens  {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.5s ease 3s both}

  /* Common digital nerves */
  .cdn-thm{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.3s ease 3.6s both}
  .cdn-1  {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.3s ease 3.7s both}
  .cdn-2  {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.2s ease 3.9s both}
  .cdn-3  {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.2s ease 4s both}

  /* Thumb PDNs */
  .pdn-thm-r{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.8s ease 4.9s both}
  .pdn-thm-u{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.8s ease 5.1s both}

  /* Index PDNs */
  .pdn-idx-r{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.9s ease 5.1s both}
  .pdn-idx-u{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.9s ease 5.2s both}

  /* Middle PDNs */
  .pdn-mid-r{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.9s ease 5.3s both}
  .pdn-mid-u{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.9s ease 5.5s both}

  /* Ring PDNs */
  .pdn-rng-r{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.9s ease 5.6s both}
  .pdn-rng-u{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.9s ease 5.7s both}

  /* Pinky PDNs */
  .pdn-pky-r{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.8s ease 5.9s both}
  .pdn-pky-u{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.8s ease 6s both}

  /* Radial dorsal branches */
  .rad-idx  {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.5s ease 4.3s both}
  .rad-mid  {stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawNerve 1.4s ease 4.5s both}

  /* Tip arcs */
  .tip-arc{animation:fadeIn .8s ease 7.4s both;opacity:0}

  /* Territories */
  .terr-med{animation:fadeIn 1.3s ease 7.6s both}
  .terr-uln{animation:fadeIn 1.3s ease 7.9s both}
  .terr-rad{animation:fadeIn 1.3s ease 8.3s both}

  /* Nodes */
  .node{animation:fadeIn .6s ease 5.2s both}

  /* Labels + inset */
  .labels{animation:fadeIn 1s ease 9.1s both}
  .inset {animation:fadeIn 1.2s ease 8.5s both}

  /* Pulses appear late */
  .pulse{animation:fadeIn .5s ease 10.2s both}
</style>
</head>
